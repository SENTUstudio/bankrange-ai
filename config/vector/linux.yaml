# Specialist: Linux Vector
# Handles Syslog-formatted logs from OS-specific topic

sources:
  in_raw_kafka:
    type: "kafka"
    bootstrap_servers: "kafka:29092"
    group_id: "vector-linux-emergency-v1"
    topics: ["bankrange-raw-linux"]
    auto_offset_reset: "earliest"

transforms:
  process_linux:
    type: "remap"
    inputs: ["in_raw_kafka"]
    source: |
      # 1. Metadatos base
      .os = "linux"
      .environment = "simulation"
      .tenant_id = "blue-team"
      ingest_ts = now()
      raw = to_string(.message) ?? ""

      # 2. Parsear syslog RFC 3164
      # Formato: <PRI>Mon DD HH:MM:SS hostname appname[uuid]: user - level - message (src=IP branch=CODE ...)
      parsed, err = parse_syslog(raw)
      if err == null {
          .hostname   = parsed.hostname
          .event_type = parsed.appname
          .timestamp  = parsed.timestamp
          # El message syslog tiene formato: "USER - LEVEL - texto real (src=IP branch=CODE ...)"
          syslog_msg  = to_string(parsed.message) ?? ""
          .message    = syslog_msg

          # Extraer username (primer token antes de " - ")
          user_match, _ = parse_regex(syslog_msg, r'^(?P<user>\S+)\s+-\s+')
          .username = user_match.user ?? "SYSTEM"

          # Extraer level
          level_match, _ = parse_regex(syslog_msg, r'^\S+\s+-\s+(?P<lvl>\w+)\s+-\s+')
          .level = downcase(level_match.lvl ?? "info")
      } else {
          .hostname  = null
          .username  = "SYSTEM"
          .level     = "info"
          .timestamp = now()
          .message   = raw
          .event_type = "unknown"
      }

      # 3. Extraer ip_address y branch del payload (presentes en todos los eventos)
      ip_match, _ = parse_regex(raw, r'src=(?P<ip>[\d\.]+)')
      .ip_address = ip_match.ip ?? null

      branch_match, _ = parse_regex(raw, r'branch=(?P<br>[A-Z]{3}\d{3,4})')
      .branch = branch_match.br ?? "unknown"

      # 4. Cálculo de lag
      ts_obj = to_timestamp(.timestamp) ?? ingest_ts
      .pipeline_lag_ms = (to_float(ingest_ts) - to_float(ts_obj)) * 1000.0
      if .pipeline_lag_ms < 0.0 { .pipeline_lag_ms = 0.0 }

      # 5. Cleanup
      del(.headers)
      del(.source_type)
      del(.topic)

sinks:
  out_clean_kafka:
    type: "kafka"
    inputs: ["process_linux"]
    bootstrap_servers: "kafka:29092"
    topic: "bankrange-clean-linux"
    encoding:
      codec: "json"

  out_loki:
    type: "loki"
    inputs: ["process_linux"]
    endpoint: "http://loki:3100"
    healthcheck:
      enabled: true
    encoding:
      codec: "json"
    labels:
      os: "{{ os }}"
      level: "{{ level }}"
      environment: "{{ environment }}"
      branch: "{{ branch }}"
    out_of_order_action: "accept"
