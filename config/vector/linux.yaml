# Specialist: Linux Vector
# Handles Syslog-formatted logs from OS-specific topic

sources:
  in_raw_kafka:
    type: "kafka"
    bootstrap_servers: "kafka:29092"
    group_id: "vector-linux-emergency-v1"
    topics: ["bankrange-raw-linux"]
    auto_offset_reset: "earliest"

transforms:
  process_linux:
    type: "remap"
    inputs: ["in_raw_kafka"]
    source: |
      # 1. Metadatos base
      .os = "linux"
      .environment = "simulation"
      .tenant_id = "blue-team"
      ingest_ts = now()
      raw = to_string(.message) ?? ""

      # 2. Parsear syslog RFC 3164
      parsed, err = parse_syslog(raw)
      if err == null {
          .hostname   = parsed.hostname
          .event_type = parsed.appname
          .timestamp  = parsed.timestamp
          syslog_msg  = to_string(parsed.message)
          .message    = syslog_msg

          # Extraer username: primer token antes de " - "
          .username = "SYSTEM"
          user_match, user_err = parse_regex(syslog_msg, r'^(?P<user>\S+)\s+-\s+')
          if user_err == null {
              .username = to_string(user_match.user)
          }

          # Extraer level: segundo token
          .level = "info"
          lvl_match, lvl_err = parse_regex(syslog_msg, r'^\S+\s+-\s+(?P<lvl>\w+)\s+-\s+')
          if lvl_err == null {
              .level = downcase(to_string(lvl_match.lvl))
          }
      } else {
          .hostname   = null
          .username   = "SYSTEM"
          .level      = "info"
          .timestamp  = now()
          .message    = raw
          .event_type = "unknown"
      }

      # 3. Extraer ip_address y branch del payload
      .ip_address = null
      ip_match, ip_err = parse_regex(raw, r'src=(?P<ip>[\d\.]+)')
      if ip_err == null {
          .ip_address = to_string(ip_match.ip)
      }

      .branch = "unknown"
      br_match, br_err = parse_regex(raw, r'branch=(?P<br>[A-Z]{3}\d{3,4})')
      if br_err == null {
          .branch = to_string(br_match.br)
      }

      # 4. Cálculo de lag (timestamp ya es tipo timestamp desde parse_syslog)
      .pipeline_lag_ms = (to_float(ingest_ts) - to_float(.timestamp)) * 1000.0
      if .pipeline_lag_ms < 0.0 { .pipeline_lag_ms = 0.0 }

      # 5. Cleanup
      del(.headers)
      del(.source_type)
      del(.topic)

  lag_to_metric_linux:
    type: "log_to_metric"
    inputs: ["process_linux"]
    metrics:
      - type: "histogram"
        field: "pipeline_lag_ms"
        name: "pipeline_lag_ms"
        namespace: "bankrange"
        tags:
          os: "linux"

sinks:
  out_clean_kafka:
    type: "kafka"
    inputs: ["process_linux"]
    bootstrap_servers: "kafka:29092"
    topic: "bankrange-clean-linux"
    encoding:
      codec: "json"

  out_loki:
    type: "loki"
    inputs: ["process_linux"]
    endpoint: "http://loki:3100"
    healthcheck:
      enabled: true
    encoding:
      codec: "json"
    labels:
      os: "{{ os }}"
      level: "{{ level }}"
      environment: "{{ environment }}"
      branch: "{{ branch }}"
    out_of_order_action: "accept"

  out_prometheus:
    type: "prometheus_exporter"
    inputs: ["lag_to_metric_linux"]
    address: "0.0.0.0:9599"
    default_namespace: "bankrange"
