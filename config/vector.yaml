# ============================================================================
# SOLUCION MAESTRA: DATA ENGINEERING PIPELINE (VECTOR ETL)
# ============================================================================
# Toma strings caóticos de un lago sucio, los normaliza mediante Regex/Split
# de VRL y los vuelca limpios en un segundo tópico y en Loki nativo.
#
# Arquitectura:
# [Kafka:bankrange-raw] -> [Vector:ETL_VRL] -> [Kafka:bankrange-clean] AND [Loki]
# ============================================================================

sources:
  in_raw_kafka:
    type: "kafka"
    bootstrap_servers: "kafka:29092"
    group_id: "vector-master-etl"
    topics:
      - "bankrange-raw"
    auto_offset_reset: "earliest"

transforms:
  # --------------------------------------------------------------------------
  # TRANSFORMACIÓN VRL (Vector Remap Language)
  # --------------------------------------------------------------------------
  process_chaos:
    type: "remap"
    inputs:
      - "in_raw_kafka"
    source: |
      # 1. Parseamos el buffer a string crudo local
      raw = to_string!(.message)
      
      # Set general defaults / metadata
      .tenant_id = "blue-team"
      
      # 2A. BRANCH: WINDOWS (Basado en flatten-XML)
      if contains(raw, "<Event><System>") {
          .os_type = "windows"
          .timestamp = parse_regex!(raw, r'SystemTime="(?P<ts>[^"]+)"').ts
          .hostname = parse_regex!(raw, r'<Computer>(?P<comp>[^<]+)</Computer>').comp
          .event_type = parse_regex!(raw, r'Provider Name="(?P<ev>[^"]+)"').ev
          .username = parse_regex!(raw, r'UserID="(?P<usr>[^"]+)"').usr
          .severity = downcase(parse_regex!(raw, r'<Data Name="Level">(?P<lvl>[^<]+)</Data>').lvl)
          .ip_address = parse_regex!(raw, r'<Data Name="IP">(?P<ip>[^<]+)</Data>').ip
          .branch_code = parse_regex!(raw, r'<Data Name="Branch">(?P<br>[^<]+)</Data>').br
          .message = parse_regex!(raw, r'<Data Name="Message">(?P<msg>[^<]+)</Data>').msg
      } else if starts_with(raw, "<134>") {
          # 2B. BRANCH: LINUX (Basado en RFC 3164 pattern local)
          .os_type = "linux"
          parsed = parse_regex!(raw, r'^<\d+>[A-Za-z]+\s+\d+\s+\d{2}:\d{2}:\d{2}\s+(?P<hostname>\S+)\s+(?P<event_type>[^\[]+)\[[^\]]+\]:\s+(?P<username>\S+)\s+-\s+(?P<severity>[A-Za-z]+)\s+-\s+(?P<msg>.*)\s+\(src=(?P<ip>\S+)\s+branch=(?P<branch>[^\)]+)\)$')
          
          .hostname = parsed.hostname
          .event_type = parsed.event_type
          .username = parsed.username
          .severity = downcase(parsed.severity)
          .message = parsed.msg
          .ip_address = parsed.ip
          .branch_code = parsed.branch
      } else {
          # 2C. BRANCH: MACOS (Basado en Tab-Separated Values TSV)
          # Una técnica mucho más rápida que Regex para CSV/TSV: 'split' a array temporal
          parts = split(raw, "\t")
          
          .timestamp = parts[0]
          .hostname = parts[1]
          .username = parts[2]
          .event_type = parts[4]
          .severity = downcase!(parts[5])
          .message = parts[6]
          .ip_address = parts[7]
          .branch_code = parts[8]
          .os_type = "macos"
      }
      
      # 3. Limpieza: Eliminamos el payload .message crudo gigante que nos enviaron 
      # originalmente desde Kafka, ya no lo necesitamos, solo consumirá storage
      # Nota: Usamos el campo `.message` estandarizado como nuestro output de texto limpio
      # Si quisieras esconderlo del debug, seria del(.)

sinks:
  # D1: Kafka Clean Topic (Donde los Agentes LLM podrán morder JSON perfecto)
  out_clean_kafka:
    type: "kafka"
    inputs:
      - "process_chaos"
    bootstrap_servers: "kafka:29092"
    topic: "bankrange-clean"
    encoding:
      codec: "json"

  # D2: El Indexador SIEM
  out_loki_siem:
    type: "loki"
    inputs:
      - "process_chaos"
    endpoint: "http://loki:3100"
    encoding:
      codec: "json"
    labels:
      os: "{{ os_type }}"
      level: "{{ severity }}"
      environment: "simulation"
      branch: "{{ branch_code }}"
    out_of_order_action: "accept"
