version: '3.8'

services:
  # ---------------------------------------------------------
  # MESSAGE BROKER (Core Ingestion)
  # ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bankrange-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bankrange-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "BankRange Local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------
  # DATA PIPELINE & OBSERVABILITY (Blue Team)
  # ---------------------------------------------------------
  vector:
    image: timberio/vector:0.34.X-debian
    container_name: bankrange-vector
    command: ["-c", "/etc/vector/vector.yaml", "-v"] # Add verbose logging
    volumes:
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: bankrange-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    # In a real environment, you'd mount a volume here, but to avoid 
    # exploding local disk space in dev mode, we keep it ephemeral.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: bankrange-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped
