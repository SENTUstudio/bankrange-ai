version: "3.8"

services:
  # ---------------------------------------------------------
  # MESSAGE BROKER (Core Ingestion)
  # ---------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bankrange-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bankrange-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "BankRange Local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bankrange-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/bash -c "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-raw-windows --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-raw-linux --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-raw-macos --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-clean-windows --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-clean-linux --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic bankrange-clean-macos --partitions 1 --replication-factor 1
      "

  bankrange-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bankrange-api
    ports:
      - "8000:8000"
    environment:
      - BR_KAFKA_BROKERS=kafka:29092
      - BR_NUM_BRANCHES=10
      - BR_WORKSTATIONS_PER_BRANCH=100
      - BR_EMPLOYEES_PER_BRANCH=120
      - BR_WINDOWS_PCT=60
      - BR_LINUX_PCT=30
      - BR_MACOS_PCT=10
      - BR_BASE_EPS=2.0
      - BR_API_KEY=${BR_API_KEY:-change-me-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  bankrange-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: bankrange-ui
    ports:
      - "8080:80"
    depends_on:
      bankrange-api:
        condition: service_healthy

  # ---------------------------------------------------------
  # DATA PIPELINE & OBSERVABILITY (Trident Architecture)
  # ---------------------------------------------------------
  vector-windows:
    image: timberio/vector:0.34.X-debian
    container_name: bankrange-vector-windows
    command: ["-c", "/etc/vector/windows.yaml"]
    volumes:
      - ./config/vector/windows.yaml:/etc/vector/windows.yaml:ro
    ports:
      - "9598:9598"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    restart: unless-stopped

  vector-linux:
    image: timberio/vector:0.34.X-debian
    container_name: bankrange-vector-linux
    command: ["-c", "/etc/vector/linux.yaml"]
    volumes:
      - ./config/vector/linux.yaml:/etc/vector/linux.yaml:ro
    ports:
      - "9599:9599"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    restart: unless-stopped

  vector-macos:
    image: timberio/vector:0.34.X-debian
    container_name: bankrange-vector-macos
    command: ["-c", "/etc/vector/macos.yaml"]
    volumes:
      - ./config/vector/macos.yaml:/etc/vector/macos.yaml:ro
    ports:
      - "9600:9600"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bankrange-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - vector-windows
      - vector-linux
      - vector-macos
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: bankrange-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: bankrange-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
    driver: local