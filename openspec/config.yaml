# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python (FastAPI, uv), SvelteKit + TypeScript (UI), Docker Compose, Kafka, Vector, Loki, Grafana.
  Architecture: Hexagonal Architecture, DDD, SOLID.
  Testing: pytest (TDD estricto) + Vitest (UI unit) + Playwright (E2E).
  Style: ruff (linter + formatter), mypy (type checker).

strict_tdd: true

testing:
  runner:
    command: "uv run pytest tests/ -v"
    framework: "pytest"
  layers:
    unit:
      available: true
      tool: "pytest"
    integration:
      available: true
      tool: "pytest"
    e2e:
      available: false
      tool: "playwright"
  coverage:
    available: true
    command: "uv run pytest tests/ --cov=adapters --cov=core --cov-report=term-missing"
    threshold: 80
  quality_tools:
    linter:
      available: true
      command: "uv run ruff check ."
      fix_command: "uv run ruff check --fix ."
    type_checker:
      available: true
      command: "uv run mypy ."
    formatter:
      available: true
      command: "uv run ruff format ."
  ui:
    runner:
      command: "cd ui && npm run test"
      framework: "vitest"
    e2e:
      command: "cd ui && npm run test:e2e"
      framework: "playwright"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
